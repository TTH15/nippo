<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<rect width="1600" height="1100" fill="#e5e7eb"/><rect x="55" y="35" width="1490" height="1030" rx="24" fill="#fff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;fill:#1e293b}.muted{fill:#64748b}.faint{fill:#94a3b8}.white{fill:#fff}.h{font-size:28px;font-weight:700}.body{font-size:20px}.small{font-size:15px}.tiny{font-size:13px}.money{font-size:24px;font-weight:700}.card{fill:#f8fafc;stroke:#dbe3ee;stroke-width:2}.row{fill:#fff;stroke:#d6dee9;stroke-width:2}.selected{fill:#fffaf0;stroke:#f59e0b;stroke-width:3}.disabled{fill:#edf2f7}.line{stroke:#e2e8f0;stroke-width:2}</style>

<!-- modal header -->
