<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#e5e7eb"/><rect x="70" y="45" width="1460" height="910" rx="22" fill="white"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;fill:#1e293b}.muted{fill:#64748b}.label{font-size:18px;fill:#64748b}.input{fill:#fff;stroke:#cbd5e1;stroke-width:2}.soft{fill:#f8fafc;stroke:#e2e8f0;stroke-width:2}.active{fill:#1e293b}.accent{fill:#fff7ed;stroke:#f59e0b;stroke-width:3}.h{font-size:28px;font-weight:700}.body{font-size:22px}.small{font-size:16px}.money{font-size:31px;font-weight:700}text[fill="white"]{fill:#fff}</style>
<rect x="110" y="80" width="56" height="56" rx="14" fill="#f1f5f9"/><text x="138" y="117" text-anchor="middle" font-size="28">a</text><circle cx="188" cy="108" r="9" fill="#f59e0b"/><text x="215" y="117" class="h">Amazon 上鳥羽吉祥院</text><rect x="605" y="83" width="34" height="34" rx="8" fill="#f8fafc"/><text x="622" y="107" text-anchor="middle" class="muted">✎</text><text x="215" y="143" class="small muted">Amazon</text><text x="1125" y="113" class="small muted">B｜契約ビルダー（推奨）</text>
<line x1="110" y1="172" x2="1490" y2="172" stroke="#e2e8f0" stroke-width="2"/><text x="125" y="215" class="body muted">基本情報</text><text x="290" y="215" class="body muted">運行設定</text><text x="450" y="215" class="body" fill="#c2410c">単価設定</text>
<text x="125" y="275" class="h">契約単価</text><text x="125" y="305" class="small muted">売上と支払を、それぞれ契約書どおりに設定します</text>
<rect x="125" y="345" width="625" height="445" rx="16" class="soft"/><circle cx="165" cy="390" r="19" fill="#f59e0b"/><text x="165" y="397" text-anchor="middle" fill="white" class="small">1</text><text x="200" y="398" class="body" font-weight="700">取引先への売上</text>
<text x="155" y="445" class="label">何に対して支払われますか</text><rect x="155" y="465" width="170" height="48" rx="24" class="active"/><text x="240" y="496" text-anchor="middle" fill="white" class="small">1日</text><rect x="337" y="465" width="170" height="48" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="422" y="496" text-anchor="middle" class="small">1個</text><rect x="519" y="465" width="170" height="48" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="604" y="496" text-anchor="middle" class="small">両方</text>
<text x="155" y="565" class="label">契約書に書かれた金額</text><rect x="155" y="585" width="534" height="92" rx="12" class="accent"/><text x="180" y="617" class="small muted">税抜</text><text x="660" y="650" text-anchor="end" class="money">¥17,000</text>
<rect x="155" y="695" width="534" height="58" rx="10" fill="#eef2f7"/><text x="180" y="731" class="small muted">請求時の税込額</text><text x="660" y="733" text-anchor="end" class="body muted">¥18,700</text>
<rect x="780" y="345" width="625" height="445" rx="16" class="soft"/><circle cx="820" cy="390" r="19" fill="#475569"/><text x="820" y="397" text-anchor="middle" fill="white" class="small">2</text><text x="855" y="398" class="body" font-weight="700">ドライバーへの支払</text>
<text x="810" y="445" class="label">何に対して支払いますか</text><rect x="810" y="465" width="170" height="48" rx="24" class="active"/><text x="895" y="496" text-anchor="middle" fill="white" class="small">1日</text><rect x="992" y="465" width="170" height="48" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="1077" y="496" text-anchor="middle" class="small">1個</text><rect x="1174" y="465" width="170" height="48" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="1259" y="496" text-anchor="middle" class="small">両方</text>
<text x="810" y="565" class="label">実際に振り込む金額</text><rect x="810" y="585" width="534" height="92" rx="12" class="accent"/><text x="835" y="617" class="small muted">税込</text><text x="1315" y="650" text-anchor="end" class="money">¥13,000</text>
<rect x="810" y="695" width="534" height="58" rx="10" fill="#eef2f7"/><text x="835" y="731" class="small muted">税抜集計額</text><text x="1315" y="733" text-anchor="end" class="body muted">¥11,818</text>
<rect x="125" y="830" width="1280" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="155" y="873" class="small muted">税抜粗利</text><text x="1370" y="875" text-anchor="end" class="h">¥5,182 / 日</text>
<text x="125" y="930" class="small muted">特徴：ユーザーが考える順番と画面の順番が一致。セレクトをなくし、契約書の言葉に寄せる。</text>
</svg>
