<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<rect width="1600" height="1200" fill="#e5e7eb"/><rect x="55" y="35" width="1490" height="1130" rx="24" fill="#fff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;fill:#1e293b}.white{fill:#fff}.muted{fill:#64748b}.faint{fill:#94a3b8}.h{font-size:28px;font-weight:700}.body{font-size:21px}.small{font-size:15px}.tiny{font-size:13px}.money{font-size:25px;font-weight:700}.card{fill:#f8fafc;stroke:#dbe3ee;stroke-width:2}.row{fill:#fff;stroke:#d6dee9;stroke-width:2}.selected{fill:#fffaf0;stroke:#f59e0b;stroke-width:3}.disabled{fill:#edf2f7}.check{fill:#1e293b}.line{stroke:#e2e8f0;stroke-width:2}</style>

<!-- header -->
<rect x="95" y="70" width="56" height="56" rx="14" fill="#f1f5f9"/><text x="123" y="107" text-anchor="middle" font-size="28">a</text><circle cx="174" cy="98" r="9" fill="#f59e0b"/>
<text x="200" y="108" class="h">Amazon 上鳥羽吉祥院</text><rect x="590" y="76" width="34" height="34" rx="8" fill="#f1f5f9"/><path d="M600 101l14-14 4 4-14 14-6 2z" fill="#64748b"/><text x="200" y="136" class="small muted">Amazon</text><text x="1245" y="105" class="small muted">B2｜お金の流れ</text>
<line x1="95" y1="165" x2="1505" y2="165" class="line"/><text x="110" y="207" class="body muted">基本情報</text><text x="265" y="207" class="body muted">運行設定</text><text x="420" y="207" class="body" fill="#c2410c">単価設定</text>

<!-- flow headings -->
<rect x="105" y="245" width="665" height="70" rx="14" fill="#eff6ff"/><circle cx="145" cy="280" r="21" fill="#2563eb"/><path d="M156 280h-22m0 0 8-8m-8 8 8 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="278" class="body" font-weight="700">入ってくるお金</text><text x="180" y="299" class="tiny muted">取引先への売上</text>
<rect x="830" y="245" width="665" height="70" rx="14" fill="#fff7ed"/><circle cx="870" cy="280" r="21" fill="#ea580c"/><path d="M859 280h22m0 0-8-8m8 8-8 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="905" y="278" class="body" font-weight="700">出ていくお金</text><text x="905" y="299" class="tiny muted">ドライバーへの支払</text>

<!-- cards -->
<rect x="105" y="330" width="665" height="650" rx="16" class="card"/><rect x="830" y="330" width="665" height="650" rx="16" class="card"/>

<!-- calculation bases, independent -->
<text x="135" y="372" class="small muted">計算に使う単位</text><rect x="135" y="390" width="210" height="54" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="154" y="407" width="20" height="20" rx="5" class="check"/><path d="M159 417l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.5"/><text x="188" y="424" class="body">日当</text><rect x="360" y="390" width="210" height="54" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="379" y="407" width="20" height="20" rx="5" class="check"/><path d="M384 417l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.5"/><text x="413" y="424" class="body">個数単価</text>
<text x="860" y="372" class="small muted">計算に使う単位</text><rect x="860" y="390" width="210" height="54" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="879" y="407" width="20" height="20" rx="5" class="check"/><path d="M884 417l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.5"/><text x="913" y="424" class="body">日当</text><rect x="1085" y="390" width="210" height="54" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="1104" y="407" width="20" height="20" rx="5" class="check"/><path d="M1109 417l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.5"/><text x="1138" y="424" class="body">個数単価</text>
<text x="135" y="468" class="tiny muted">2つともONなら、日当と個数単価を加算</text><text x="860" y="468" class="tiny muted">「両方」という別モードは作らない</text>

<!-- revenue daily -->
<text x="135" y="510" class="body" font-weight="700">日当</text><rect x="135" y="528" width="605" height="70" rx="11" class="selected"/><circle cx="165" cy="563" r="10" fill="#fff" stroke="#f59e0b" stroke-width="3"/><circle cx="165" cy="563" r="5" fill="#f59e0b"/><text x="190" y="552" class="tiny muted">税抜</text><text x="190" y="578" class="small">契約書に記載・入力</text><text x="710" y="573" text-anchor="end" class="money">¥17,000</text>
<rect x="135" y="606" width="605" height="62" rx="11" class="disabled"/><circle cx="165" cy="637" r="10" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="190" y="630" class="tiny muted">税込</text><text x="190" y="651" class="tiny faint">自動計算・編集不可</text><text x="710" y="646" text-anchor="end" class="body muted">¥18,700</text>
<!-- revenue piece -->
<text x="135" y="714" class="body" font-weight="700">個数単価 <tspan class="tiny muted">/ 個</tspan></text><rect x="135" y="732" width="605" height="62" rx="11" class="selected"/><circle cx="165" cy="763" r="10" fill="#fff" stroke="#f59e0b" stroke-width="3"/><circle cx="165" cy="763" r="5" fill="#f59e0b"/><text x="190" y="756" class="tiny muted">税抜・入力</text><text x="710" y="772" text-anchor="end" class="money">¥160</text><rect x="135" y="802" width="605" height="56" rx="11" class="disabled"/><circle cx="165" cy="830" r="10" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="190" y="835" class="tiny muted">税込・自動</text><text x="710" y="838" text-anchor="end" class="body muted">¥176</text>

<!-- payout daily -->
<text x="860" y="510" class="body" font-weight="700">日当</text><rect x="860" y="528" width="605" height="62" rx="11" class="disabled"/><circle cx="890" cy="559" r="10" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="915" y="552" class="tiny muted">税抜</text><text x="915" y="574" class="tiny faint">自動計算・編集不可</text><text x="1435" y="568" text-anchor="end" class="body muted">¥11,818</text>
<rect x="860" y="598" width="605" height="70" rx="11" class="selected"/><circle cx="890" cy="633" r="10" fill="#fff" stroke="#f59e0b" stroke-width="3"/><circle cx="890" cy="633" r="5" fill="#f59e0b"/><text x="915" y="622" class="tiny muted">税込</text><text x="915" y="648" class="small">実際の振込額・入力</text><text x="1435" y="643" text-anchor="end" class="money">¥13,000</text>
<!-- payout piece -->
<text x="860" y="714" class="body" font-weight="700">個数単価 <tspan class="tiny muted">/ 個</tspan></text><rect x="860" y="732" width="605" height="56" rx="11" class="disabled"/><circle cx="890" cy="760" r="10" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="915" y="765" class="tiny muted">税抜・自動</text><text x="1435" y="768" text-anchor="end" class="body muted">¥136</text><rect x="860" y="796" width="605" height="62" rx="11" class="selected"/><circle cx="890" cy="827" r="10" fill="#fff" stroke="#f59e0b" stroke-width="3"/><circle cx="890" cy="827" r="5" fill="#f59e0b"/><text x="915" y="832" class="tiny muted">税込・入力</text><text x="1435" y="838" text-anchor="end" class="money">¥150</text>

<!-- optional minimum rule -->
<rect x="135" y="885" width="605" height="62" rx="10" fill="#fff" stroke="#d6dee9"/><rect x="155" y="906" width="20" height="20" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="190" y="925" class="small">最低個数を保証</text>
<rect x="860" y="885" width="605" height="62" rx="10" fill="#fff" stroke="#d6dee9"/><rect x="880" y="906" width="20" height="20" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="915" y="925" class="small">最低個数を保証</text>

<!-- margins scoped by unit -->
<text x="105" y="1025" class="body" font-weight="700">粗利は単位ごとに表示</text><rect x="105" y="1048" width="665" height="78" rx="13" fill="#f8fafc" stroke="#dbe3ee" stroke-width="2"/><text x="135" y="1080" class="small muted">日当の税抜粗利</text><text x="740" y="1098" text-anchor="end" class="money">¥5,182 / 日</text>
<rect x="830" y="1048" width="665" height="78" rx="13" fill="#f8fafc" stroke="#dbe3ee" stroke-width="2"/><text x="860" y="1080" class="small muted">個数の税抜粗利</text><text x="1465" y="1098" text-anchor="end" class="money">¥24 / 個</text>
<text x="105" y="1150" class="tiny muted">異なる単位を無理に合算しない。日報の個数が入った時点で、その日の実績粗利を別画面で算出する。</text>
</svg>
