<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<rect width="1600" height="1050" fill="#e5e7eb"/><rect x="40" y="30" width="1520" height="990" rx="24" fill="#fff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;fill:#1e293b}.muted{fill:#64748b}.h{font-size:28px;font-weight:700}.body{font-size:20px}.small{font-size:15px}.tiny{font-size:13px}.money{font-size:24px;font-weight:700}.card{fill:#f8fafc;stroke:#dbe3ee;stroke-width:2}.selected{fill:#fffaf0;stroke:#f59e0b;stroke-width:3}.disabled{fill:#edf2f7}.line{stroke:#e2e8f0;stroke-width:2}</style>

<!-- header -->
<rect x="80" y="65" width="56" height="56" rx="14" fill="#f1f5f9"/><text x="108" y="102" text-anchor="middle" font-size="28">a</text><circle cx="159" cy="93" r="9" fill="#f59e0b"/><text x="185" y="103" class="h">Amazon 上鳥羽吉祥院</text><rect x="575" y="71" width="34" height="34" rx="8" fill="#f1f5f9"/><path d="M585 96l14-14 4 4-14 14-6 2z" fill="#64748b"/><text x="185" y="131" class="small muted">Amazon</text><text x="1230" y="100" class="small muted">B4｜一体型フロー</text>
<line x1="80" y1="160" x2="1520" y2="160" class="line"/><text x="95" y="202" class="body muted">基本情報</text><text x="250" y="202" class="body muted">運行設定</text><text x="405" y="202" class="body" fill="#c2410c">単価設定</text>

<!-- the rail is behind the actual editor cards -->
<path d="M80 555H1520" fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/><path d="M750 555l-20-16v32zM910 555l-20-16v32z" fill="#94a3b8"/>

<!-- full sales editor card -->
<rect x="125" y="255" width="585" height="625" rx="18" class="card"/>
<text x="160" y="302" class="h">売上</text><text x="650" y="301" text-anchor="end" class="small muted">取引先からの契約単価</text>
<rect x="160" y="326" width="180" height="48" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="178" y="341" width="19" height="19" rx="5" fill="#1e293b"/><path d="M183 350l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.4"/><text x="212" y="359" class="small">日当</text><rect x="352" y="326" width="180" height="48" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="370" y="341" width="19" height="19" rx="5" fill="#1e293b"/><path d="M375 350l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.4"/><text x="404" y="359" class="small">個数単価</text>
<text x="160" y="420" class="body" font-weight="700">日当</text><rect x="160" y="437" width="250" height="78" rx="11" class="selected"/><text x="180" y="464" class="tiny muted">税抜・入力</text><text x="386" y="498" text-anchor="end" class="money">¥17,000</text><rect x="425" y="437" width="250" height="78" rx="11" class="disabled"/><text x="445" y="464" class="tiny muted">税込・自動</text><text x="651" y="498" text-anchor="end" class="money muted">¥18,700</text>
<text x="160" y="563" class="body" font-weight="700">個数単価 <tspan class="tiny muted">/ 個</tspan></text><rect x="160" y="580" width="250" height="78" rx="11" class="selected"/><text x="180" y="607" class="tiny muted">税抜・入力</text><text x="386" y="641" text-anchor="end" class="money">¥160</text><rect x="425" y="580" width="250" height="78" rx="11" class="disabled"/><text x="445" y="607" class="tiny muted">税込・自動</text><text x="651" y="641" text-anchor="end" class="money muted">¥176</text>
<rect x="160" y="690" width="515" height="56" rx="10" fill="#fff" stroke="#d6dee9"/><rect x="180" y="708" width="20" height="20" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="215" y="727" class="small">最低個数を保証</text>
<rect x="160" y="773" width="515" height="76" rx="11" fill="#fff" stroke="#dbe3ee"/><text x="180" y="802" class="tiny muted">税抜粗利</text><text x="180" y="832" class="small muted">日当 ¥5,182 / 日</text><text x="645" y="832" text-anchor="end" class="small muted">個数 ¥24 / 個</text>

<!-- full payout editor card -->
<rect x="890" y="255" width="585" height="625" rx="18" class="card"/>
<text x="925" y="302" class="h">支払</text><text x="1415" y="301" text-anchor="end" class="small muted">ドライバーへの契約単価</text>
<rect x="925" y="326" width="180" height="48" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="943" y="341" width="19" height="19" rx="5" fill="#1e293b"/><path d="M948 350l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.4"/><text x="977" y="359" class="small">日当</text><rect x="1117" y="326" width="180" height="48" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="1135" y="341" width="19" height="19" rx="5" fill="#1e293b"/><path d="M1140 350l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.4"/><text x="1169" y="359" class="small">個数単価</text>
<text x="925" y="420" class="body" font-weight="700">日当</text><rect x="925" y="437" width="250" height="78" rx="11" class="disabled"/><text x="945" y="464" class="tiny muted">税抜・自動</text><text x="1151" y="498" text-anchor="end" class="money muted">¥11,818</text><rect x="1190" y="437" width="250" height="78" rx="11" class="selected"/><text x="1210" y="464" class="tiny muted">税込・入力</text><text x="1416" y="498" text-anchor="end" class="money">¥13,000</text>
<text x="925" y="563" class="body" font-weight="700">個数単価 <tspan class="tiny muted">/ 個</tspan></text><rect x="925" y="580" width="250" height="78" rx="11" class="disabled"/><text x="945" y="607" class="tiny muted">税抜・自動</text><text x="1151" y="641" text-anchor="end" class="money muted">¥136</text><rect x="1190" y="580" width="250" height="78" rx="11" class="selected"/><text x="1210" y="607" class="tiny muted">税込・入力</text><text x="1416" y="641" text-anchor="end" class="money">¥150</text>
<rect x="925" y="690" width="515" height="56" rx="10" fill="#fff" stroke="#d6dee9"/><rect x="945" y="708" width="20" height="20" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="980" y="727" class="small">最低個数を保証</text>
<rect x="925" y="773" width="515" height="76" rx="11" fill="#fff" stroke="#dbe3ee"/><text x="945" y="802" class="tiny muted">契約値の税抜換算</text><text x="945" y="832" class="small muted">日当 ¥11,818 / 日</text><text x="1410" y="832" text-anchor="end" class="small muted">個数 ¥136 / 個</text>

<!-- nodes sit above the cards and rail -->
<circle cx="85" cy="555" r="48" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><path d="M58 580h54M65 580v-46h40v46M75 545h8m8 0h8m-24 13h8m8 0h8m-24 13h8m8 0h8" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><text x="85" y="620" text-anchor="middle" class="small muted">取引先</text>
<circle cx="800" cy="555" r="58" fill="#1e293b" stroke="#fff" stroke-width="8"/><path d="M768 580h64M775 580v-40l25-14 25 14v40M788 580v-24h24v24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="632" text-anchor="middle" class="small" font-weight="700">自社</text>
<circle cx="1515" cy="555" r="48" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/><circle cx="1515" cy="539" r="14" fill="none" stroke="#ea580c" stroke-width="4"/><path d="M1489 580c3-18 12-27 26-27s23 9 26 27" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/><text x="1515" y="620" text-anchor="middle" class="small muted">ドライバー</text>

<text x="80" y="955" class="small muted">取引先から自社への売上、自社からドライバーへの支払を、実際に編集するカードそのもので表現。</text>
</svg>
