name: Native SDK validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/mobile/package.json'
      - 'apps/base/package.json'
      - 'apps/mobile/app.*'
      - 'apps/base/app.*'
      - '.github/workflows/native-build.yml'
      - 'scripts/verify-native-build.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.app }} / ${{ matrix.platform }} native build
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, base]
        platform: [ios, android]
        include:
          - platform: ios
            runner: xcode-27
          - platform: android
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_BASE_URL: https://preview.invalid
      EXPO_PUBLIC_PASSKEY_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm exec --yes --package=npm@11.21.1 -- npm ci --no-audit --no-fund
      - name: Verify native dependency versions
        run: node scripts/check-native-dependencies.mjs
      - name: Compile without signing or distribution
        run: node scripts/verify-native-build.mjs '${{ matrix.app }}' '${{ matrix.platform }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.app }}-${{ matrix.platform }}-validation
          path: native-build-artifacts/*
          if-no-files-found: error
          retention-days: 7
